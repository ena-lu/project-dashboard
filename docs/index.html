<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專案管理儀表板</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <h1>專案管理儀表板</h1>
  </header>

  <main>
    <section class="toolbar">
      <label for="client-filter">依客戶篩選：</label>
      <select id="client-filter">
        <option value="">全部客戶</option>
      </select>
    </section>

    <section class="project-list" id="project-list">

      <!-- 靜態範例卡片（供 Task 1 驗收使用，Task 3 完成後由 JS 取代） -->
      <div class="project-card">

        <div class="project-card__summary" role="button" tabindex="0" aria-expanded="true">
          <span class="project-name">電商平台改版</span>
          <span class="project-client">台灣零售股份有限公司</span>
          <span class="badge badge--development">開發中</span>
        </div>

        <div class="project-card__detail">
          <table class="phase-table">
            <thead>
              <tr>
                <th scope="col">階段</th>
                <th scope="col">預計完成日期</th>
                <th scope="col">實際完成日期</th>
                <th scope="col">預估工時（h）</th>
                <th scope="col">實際工時（h）</th>
                <th scope="col">差異</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td data-label="階段">需求確認</td>
                <td data-label="預計完成日期">2026-02-15</td>
                <td data-label="實際完成日期">
                  <input type="date" aria-label="需求確認實際完成日期" value="2026-02-18">
                </td>
                <td data-label="預估工時（h）">16</td>
                <td data-label="實際工時（h）">
                  <input type="number" class="actual-hours" aria-label="需求確認實際工時" min="0" value="20">
                </td>
                <td data-label="差異" class="diff diff--over">+4</td>
              </tr>
              <tr>
                <td data-label="階段">開案</td>
                <td data-label="預計完成日期">2026-03-01</td>
                <td data-label="實際完成日期">
                  <input type="date" aria-label="開案實際完成日期" value="">
                </td>
                <td data-label="預估工時（h）">8</td>
                <td data-label="實際工時（h）">
                  <input type="number" class="actual-hours" aria-label="開案實際工時" min="0" value="">
                </td>
                <td data-label="差異" class="diff">—</td>
              </tr>
              <tr>
                <td data-label="階段">開發</td>
                <td data-label="預計完成日期">2026-05-31</td>
                <td data-label="實際完成日期">
                  <input type="date" aria-label="開發實際完成日期" value="">
                </td>
                <td data-label="預估工時（h）">120</td>
                <td data-label="實際工時（h）">
                  <input type="number" class="actual-hours" aria-label="開發實際工時" min="0" value="">
                </td>
                <td data-label="差異" class="diff">—</td>
              </tr>
              <tr>
                <td data-label="階段">測試</td>
                <td data-label="預計完成日期">2026-06-20</td>
                <td data-label="實際完成日期">
                  <input type="date" aria-label="測試實際完成日期" value="">
                </td>
                <td data-label="預估工時（h）">40</td>
                <td data-label="實際工時（h）">
                  <input type="number" class="actual-hours" aria-label="測試實際工時" min="0" value="">
                </td>
                <td data-label="差異" class="diff">—</td>
              </tr>
              <tr>
                <td data-label="階段">發布</td>
                <td data-label="預計完成日期">2026-06-30</td>
                <td data-label="實際完成日期">
                  <input type="date" aria-label="發布實際完成日期" value="">
                </td>
                <td data-label="預估工時（h）">8</td>
                <td data-label="實際工時（h）">
                  <input type="number" class="actual-hours" aria-label="發布實際工時" min="0" value="">
                </td>
                <td data-label="差異" class="diff">—</td>
              </tr>
            </tbody>
          </table>

          <div class="trend-chart" aria-label="工時趨勢圖佔位區塊">
            <!-- SVG 趨勢圖由 app.js 動態生成（Task 3） -->
          </div>
        </div>

      </div>
      <!-- 靜態範例卡片結束 -->

    </section>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
