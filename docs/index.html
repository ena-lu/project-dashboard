<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專案管理儀表板</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <h1>專案管理儀表板</h1>
  </header>

  <main>
    <section class="toolbar">
      <label for="client-filter">依客戶篩選：</label>
      <select id="client-filter">
        <option value="">全部客戶</option>
      </select>
      <label for="status-filter">依狀態篩選：</label>
      <select id="status-filter">
        <option value="">全部狀態</option>
        <option value="需求確認中">需求確認中</option>
        <option value="待開案">待開案</option>
        <option value="開發中">開發中</option>
        <option value="測試中">測試中</option>
        <option value="待發布">待發布</option>
        <option value="已發布">已發布</option>
      </select>
      <label for="sort-by">排序：</label>
      <select id="sort-by">
        <option value="">不排序</option>
        <option value="client">客戶</option>
        <option value="status">狀態</option>
        <option value="date">預計完成日期</option>
      </select>
      <div class="view-toggle" role="group" aria-label="切換顯示模式">
        <button id="btn-list" class="btn-view btn-view--active" aria-pressed="true">列表</button>
        <button id="btn-gantt" class="btn-view" aria-pressed="false">甘特圖</button>
      </div>
    </section>

    <section class="project-list" id="project-list">
      <!-- 由 app.js 動態渲染 -->
    </section>

    <section class="gantt-view" id="gantt-view" hidden>
      <!-- 由 app.js 動態渲染 -->
    </section>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
